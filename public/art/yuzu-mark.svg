<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Yuzu">
  <defs>
    <radialGradient id="peel" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#ffd979"/>
      <stop offset="55%" stop-color="#f7ab35"/>
      <stop offset="100%" stop-color="#e2851b"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fbf98"/>
      <stop offset="100%" stop-color="#9ad9b6"/>
    </linearGradient>
  </defs>

  <!-- the fruit: deliberately not a perfect circle, so it reads as drawn rather than generated -->
  <path fill="url(#peel)"
        d="M32 15c11.6 0 19.5 7.6 19.5 18.6C51.5 45 43.4 53 32 53s-19.5-8-19.5-19.4C12.5 22.6 20.4 15 32 15z"/>

  <!-- pores: the texture that makes a citrus a citrus -->
  <g fill="#fff" opacity="0.34">
    <circle cx="24.5" cy="27" r="1.15"/><circle cx="31" cy="24.5" r="0.95"/>
    <circle cx="38.5" cy="27.5" r="1.1"/><circle cx="21.5" cy="34.5" r="0.95"/>
    <circle cx="42" cy="35" r="1"/><circle cx="27.5" cy="43" r="0.95"/>
    <circle cx="36.5" cy="44" r="1.05"/>
  </g>

  <!-- stem and two leaves, tilted the way the mascot's are -->
  <path fill="#5aa87f" d="M31.2 16.4c0-3.1.5-5.4 1.6-7.1.5-.8 1.9-.4 1.8.5-.2 2-.4 4.2-.4 6.6z"/>
  <path fill="url(#leaf)" d="M33.6 11.6c3.2-3.4 7.4-4.3 10.7-3.6.7.1.9 1 .4 1.5-2.6 2.8-7 4.6-11.1 3.4z"/>
  <path fill="url(#leaf)" d="M31.8 11.9c-2.9-3.1-6.7-4-9.7-3.4-.6.1-.8.9-.3 1.4 2.3 2.6 6.3 4.2 10 3.1z" opacity="0.88"/>
</svg>
