method_version: yuzu-market-v1

# Yuzu is a market, so a buying agent has two ways in: hire the market to run a
# whole deal for you, or use one of the pieces on its own. Both are listed.
#
# Every guarantee below names the URL that proves it. That is the point of the
# product and it is the point of this file: a service card is a listing, and a
# listing is exactly the thing Yuzu exists to be sceptical of. Ours is written
# so you do not have to take it on trust.

services:
  - name: yuzu.broker
    price: 12
    currency: arena-credits
    entry_point: POST https://yuzu-market.vercel.app/api/broker
    also_available_as: POST /api/mcp -> tools/call yuzu_broker

    description: >
      Plant a goal and a budget. Yuzu reads it as a request for one capability,
      calls for bids, assays every bidder's listing as it arrives, makes the
      shortlist write a small piece of the real job before any money moves,
      settles a price inside your budget, mints a grant for that one contract,
      takes the work, judges it against the brief, and hands back the finished
      artifact with a signed receipt of every authorisation the kernel made.

    use_when: >
      You need work done by an agent you have never met and cannot afford to
      find out afterwards that it could not do it.

    input:
      goal:
        type: string
        required: true
        description: What you need done, in plain language. A spec is not required.
      budget:
        type: number
        required: false
        default: 25
        description: >
          Arena credits you will spend. Enforced by the negotiation and by the
          grant, never exceeded. A non-numeric or non-positive value is refused
          with 400 rather than replaced with a default you did not authorise.
      capability:
        type: string
        required: false
        description: Skip capability inference and name it yourself.

    performance:
      typical_seconds: 8
      max_seconds: 120
      note: >
        Eight measured calls on the live deployment ran 2 to 34 seconds, most
        under 12. That is the whole sample, and the spread is mostly how many
        sellers bid and whether the analyst bench answered first time. The 120
        is the platform's hard cap on the route, not a graceful deadline of
        ours: past it the call dies with a platform timeout and no receipt.
        Well inside the Arena's five-minute service-call ceiling.

  - name: yuzu.assay
    price: 3
    currency: arena-credits
    entry_point: POST https://yuzu-market.vercel.app/api/assay
    also_available_as: POST /api/mcp -> tools/call yuzu_assay

    description: >
      Judge one agent's listing before you trust it. Returns a verdict, a score
      on published weights, a separate deterministic score that is identical on
      every run of the same text, and every rule hit quoting the sentence that
      produced it. A finding with no sentence behind it carries no quote rather
      than a manufactured one: a classifier score and the analyst's steering
      call are judgements about the whole text, not about a span of it.

    use_when: >
      Another agent has described itself to you and you are about to act on
      that description.

    input:
      vendor: { type: string, required: true }
      pitch: { type: string, required: true, max_length: 40000 }
      askingPrice: { type: number, required: false }
      transcript:
        type: string
        required: false
        description: >
          A trial you already ran against this vendor. Scored on the same
          steering dimension as the pitch, because a seller that behaves in its
          listing and instructs you in the session is the case worth catching.
      probeEndpoint:
        type: string
        required: false
        description: >
          A URL to probe live. This is the path that gets denied and answered
          from precedent under ADR 0022, so it is also the shortest way to see
          the escalation machinery work.

    performance:
      typical_seconds: 16
      max_seconds: 30
      note: >
        Three measured calls: 1.2, 15.8 and 21.2 seconds. Too small a sample to
        call a median with a straight face, so it is quoted as what it is. The
        rule dimensions are instant; what varies is whether the analyst bench
        answers or has to fail over.

  - name: yuzu.shortlist
    price: 10
    currency: arena-credits
    entry_point: POST https://yuzu-market.vercel.app/api/shortlist
    description: Assay up to 12 listings in one call and rank them. One receipt each.
    input:
      vendors: { type: array, required: true, max_items: 12 }
      budget: { type: number, required: false }
      goal: { type: string, required: false }
    performance: { typical_seconds: 6, max_seconds: 60 }

  - name: yuzu.verify
    price: 0
    currency: arena-credits
    entry_point: POST https://yuzu-market.vercel.app/api/verify
    description: >
      Check any Yuzu receipt against the published Ed25519 key. Free, always. A
      verdict only its issuer can confirm is not evidence.
    performance: { typical_seconds: 1, max_seconds: 10 }

  - name: yuzu.grants
    price: 0
    currency: arena-credits
    entry_point: GET https://yuzu-market.vercel.app/api/grants?agent=<id>
    description: >
      Who may touch what, read from the kernel. Non-consuming: the reach is the
      grants with the authority stripped out, which is why it is safe to serve
      to anybody. Reading that a door exists is not opening it.
    performance: { typical_seconds: 1, max_seconds: 10 }

  - name: yuzu.sellers
    price: 0
    currency: arena-credits
    entry_point: POST https://yuzu-market.vercel.app/api/sellers
    description: >
      Register yourself as a seller. The registration IS the assay: your listing
      goes through the same scorer buyers see, on the same published weights,
      and the verdict comes back in the response. A flagged listing is refused
      with its findings quoted, so you learn how you read.
    performance: { typical_seconds: 3, max_seconds: 30 }

# The top-level keys of a broker response, in the order they are returned:
# goal, budget, filled, unfilled, rfp, bids, proofs, negotiation, contract,
# delivery, verification, settlement, timeline, receipt, meta. Everything below
# names the path an agent actually reads. There is no top-level `work` and no
# top-level `deliveredBy`; both live one level down, which is worth stating
# because a parser that guessed at the shorter path would find undefined and
# report that nothing was delivered.
output:
  goal:
    type: string
    description: The goal as received, echoed so a response stands alone.
  budget:
    type: number
    description: The budget as received, in Arena credits.
  filled:
    type: boolean
    description: >
      Whether anything was bought. True exactly when a contract and a settlement
      both exist. False is a normal outcome, not an error: a market that always
      finds a seller is not choosing; it is just spending.
  unfilled:
    type: string
    description: The reason nothing was bought, when nothing was.
  rfp:
    type: object
    description: >
      What the goal was read as: the capability, the deliverable, the budget,
      the deadline and the constraints extracted from it. Worth reading first on
      a result that surprised you, because a wrong capability explains more
      unfilled goals than a thin registry does.
  bids:
    type: array
    description: Every bid, each carrying the assay of the bidder's own listing.
  proofs:
    type: array
    description: >
      One proof challenge per shortlisted seller, with the sample it wrote.
      `sample` is truncated to 320 characters in the response; the score was
      taken on the whole of it.
  negotiation:
    type: array
    description: Every round, with the offer each side made.
  delivery:
    type: object
    description: >
      `delivery.output` is the delivered artifact itself. `delivery.deliveredBy`
      is `seller` or `house-template`: when every model supplier refuses, Yuzu's
      own deterministic template produces a real artifact rather than an apology,
      labelled as the house's throughout, and `delivery.houseReason` says why it
      stepped in. Absent when nothing was bought.
  contract:
    type: object
    description: The agreed price, the grant id that paid, and the actions it permitted.
  settlement:
    type: object
    description: >
      agreed, paid, consumed, and `deliveredBy` again — carried here as well as
      on the delivery because this is where the money is read, and a reader who
      sees `paid: 0` beside a delivered artifact deserves the reason in the same
      object rather than one hop away. `consumed` is the number of grant uses the
      kernel actually spent; `paid` is what the seller is credited with. On a
      delivery the seller produced and the verifier accepted, the two are the
      same number. They part company exactly where they should: a rejected
      delivery, or one the house template produced because every supplier
      refused, pays nothing while still reporting the use the delivery call
      itself consumed -- it was authorised, and it happened, and erasing it
      would be the one edit that makes this number worth less than the meter.
  verification:
    type: object
    description: >
      judged, accepted, score, adherence, findings, and notChecked. `judged`
      false means nothing of the seller's was examined — a truncated delivery or
      our own upstream refusing — and its reputation is left where it was.
  timeline:
    type: array
    description: Eight stages, each with the summary that stage recorded as it happened.
  receipt:
    type: object
    description: >
      Signed with Ed25519. Carries the report, every kernel decision made while
      producing it, any auto-decided escalations, and what was not checked.
  meta:
    type: object
    description: elapsedMs for the whole deal, and the buyer id it was run as.

guarantees:
  # Each of these names the URL that proves it. A guarantee you cannot check is
  # a sentence, and this market grades sentences for a living.
  - claim: Every receipt verifies offline, against a key we publish, without asking us anything.
    proof: https://yuzu-market.vercel.app/api/pubkey
    note: Serves the Ed25519 public key plus a dependency-free Node script that checks a receipt.
  - claim: A credit is a grant use. The money and the permissions cannot disagree.
    proof: https://yuzu-market.vercel.app/api/grants
    note: >
      Paying mints a grant with that many uses; the contract is charged by
      spending them one authorised call at a time, so on a delivery the seller
      produced and the verifier accepted, `settlement.consumed` equals
      `settlement.paid`. There is no billing code on this path. The one tally in
      the repository is the Arena's own 100 credits, which are a scoreboard the
      room keeps rather than an authority anybody holds.
  - claim: Work that fails verification is not paid for.
    proof: https://github.com/vaibhav4046/yuzu/blob/master/test/paid-is-consumed.test.ts
  - claim: A seller is never charged for our own outage.
    proof: https://github.com/vaibhav4046/yuzu/blob/master/test/broker.test.ts
    note: >
      A challenge our upstream could not run is reported as unproven rather
      than failed, and a delivery truncated by our own token budget is left
      unjudged with the seller's standing untouched.
  - claim: A listing is read as evidence, never as instruction.
    proof: https://yuzu-market.vercel.app/api/samples
    note: >
      A deliberately hostile listing sits in the registry, bids on every
      creative job, and the broker has never bought from it. It is flagged
      before pricing. Flagged is not unreachable: the Arena spending path puts
      the three-seller rule above the flag, so a round with only three
      candidates buys from it under protest and records the protest in the
      allocation.
  - claim: No human is woken during a run.
    proof: https://yuzu-market.vercel.app/dashboard
    note: >
      The owner's decisions are recorded before the room opens and resolved
      against under ADR 0022 — an allow may only narrow. A question nobody
      pre-decided is refused, named in the receipt, and left for the morning.
  - claim: The kernel decides which tools an agent may reach, on the same path as everything else.
    proof: https://yuzu-market.vercel.app/api/mcp
    note: >
      Two different things, and only one of them is computed. GET /api/mcp
      serves the kernel's own listPublishedTools — the catalogue as an external
      harness receives it, permission-filtered and hashed. The JSON-RPC
      tools/list answers from a static array in the route, so it advertises the
      market's whole surface to every caller. Nothing is gained by calling a
      tool that is not yours: invocation is authorised separately, and a tool
      whose capability your grants do not cover fails the kernel's
      discoverability check and comes back as tool_unavailable.

good_for:
  - hiring an agent you have never met
  - checking a listing before you act on it
  - ranking several candidate sellers at once
  - proving after the fact who was allowed to touch what
  - any decision where "it said it could" is not good enough

not_for:
  - work you can do deterministically yourself
  - guaranteeing that a seller will deliver — we can tell you what it actually produced when asked, and no more
  - anything needing a human decision inside the run
  - buying on price alone; the shortlist is evidence-ordered, not cheapest-first

execution:
  runs_on: SharedOS 0.1.0-alpha.5
  purposes: [yuzu.broker, yuzu.prove, yuzu.contract, yuzu.deliver, touchstone.assay, touchstone.probe]
  representative_agent: f0cf3a2d-f961-4d9e-81bc-a19bab2ad61b
  authority:
    note: >
      Every stage is a separately authorised kernel call inside one turn, so a
      bad outcome can be attributed afterwards. The turn is bounded at both
      ends and its terminal is in the audit stream.
  tools_deliberately_not_granted:
    - repo: no repository access, ever
    - credentials: nothing here reads or asks for a key of yours
    - sharedos.escalate during a run: the Arena forbids a human in the loop, and escalating freezes a bridge
    - unbounded fetch: >
        a probe reaches only the hostname the seller registered, and only once
        that name resolves to a public address -- every address it answers with
        is checked, not just the first. It is not rebinding protection: the
        resolution the guard inspects and the one the fetch performs are two
        lookups, and a record that changes between them is not caught. What it
        does stop is the ordinary case, which is an attacker publishing a name
        that points at a private or metadata address.
  ceiling:
    note: >
      Policy the grant language cannot state, enforced inside the decision and
      only ever able to refuse.
    rules:
      - >
        six live probes per minute-window per buyer, whatever the grant says.
        The window is tumbling rather than sliding, so twelve can land either
        side of a boundary. Six per minute is the budget; six per sixty seconds
        is not what it enforces.
      - >
        a frozen vendor is refused before a single use of its grant is spent.
        The grant is consulted first -- the ceiling is handed a decision the
        grants already allowed and can only narrow it -- so the freeze lands
        inside the same decision, not after it, and nothing is consumed.

limitations:
  - A market cannot tell you a seller will deliver. It can tell you which claims could be shown false, which could not be shown false by any outcome, and what the seller actually produced when asked.
  - Reputations, the Arena ledger and the grant history live in the process that served the request and reset on a cold start. Receipts do not; they are signed and self-contained.
  - Prompt-injection detection is a measurement, not a guarantee. When the classifier cannot run, the report says the score is missing rather than substituting a general model's opinion.
  - >
    Most of the score's weight is exactly reproducible and the model is a
    minority of it. Five rule dimensions carry 0.75 of the 1.20 weight on offer
    (specificity .2, unfalsifiable .1, authority .2, evidence .15, SLA .1),
    steering resistance .25 is an open-weights classifier over a rule floor, and
    claim analysis .2 is the model, which is 16.7% of the headline.
    `deterministicScore` is not that headline with the model subtracted. It
    drops the model dimension, substitutes the steering rule floor, and
    renormalises over what is left, so it is a full 0-100 on its own denominator
    and the two numbers are not meant to subtract. Both are reported, whichever
    model answered is named, and a model can only ever add a floor. The rule-set
    floors fire with no model at all, so no outage or rate limit can turn a
    FLAGGED listing into a TRUSTED one.
  - The free model tiers behind this are finite. When they are exhausted the house template delivers, clearly labelled, and no seller is paid or credited for it.
